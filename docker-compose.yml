services:
  agentoffice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentoffice_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./workspaces:/app/workspaces
      - ./prompts:/app/prompts:ro
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
